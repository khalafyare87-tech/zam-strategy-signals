import os
import requests
from datetime import datetime, timedelta, timezone
from strategy import StrategyEngine

API_KEY = os.environ["TWELVE_DATA_API_KEY"]
SYMBOLS = ["XAU/USD", "EUR/USD", "GBP/USD"]


def get_data(symbol, interval, outputsize):
    r = requests.get(
        "https://api.twelvedata.com/time_series",
        params={
            "symbol": symbol,
            "interval": interval,
            "outputsize": outputsize,
            "apikey": API_KEY,
            "format": "JSON",
        },
        timeout=30,
    )
    r.raise_for_status()
    data = r.json()

    if "values" not in data:
        raise RuntimeError(f"{symbol} {interval}: {data}")

    return list(reversed(data["values"]))


def dt(candle):
    return datetime.strptime(
        candle["datetime"], "%Y-%m-%d %H:%M:%S"
    ).replace(tzinfo=timezone.utc)


def outcome(signal, future):
    entry = float(signal["entry"])
    sl = float(signal["sl"])
    tp = float(signal["tp1"])
    side = signal["side"]

    for candle in future:
        high = float(candle["high"])
        low = float(candle["low"])

        if side == "BUY":
            sl_hit = low <= sl
            tp_hit = high >= tp
        else:
            sl_hit = high >= sl
            tp_hit = low <= tp

        # Conservative rule:
        # if both TP and SL occur inside the same M15 candle,
        # count SL because intrabar order is unknown.
        if sl_hit and tp_hit:
            return "SL", candle["datetime"]

       
